name: License policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-license-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify proprietary and third-party notices
        run: node scripts/check-license-policy.mjs
